<!DOCTYPE html>
<html lang="nl">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoheb's SVG Validator</title>
  <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
 
  <div class="login-overlay" id="loginPage">
    <div class="login-card">
      <header class="login-header">
        <h2>Zoheb's SVG <span class="accent">Validator</span></h2>
        <p class="sub-credit">made by zoheb "examen"</p>
      </header>
      
      <form id="loginForm">
        <div class="input-group">
          <label for="username">Gebruikersnaam</label>
          <input type="text" id="username" required placeholder="Gebruikersnaam...">
        </div>
        <div class="input-group">
          <label for="password">Wachtwoord</label>
          <input type="password" id="password" required placeholder="Wachtwoord...">
        </div>
        <div id="loginError" class="login-error-msg"></div>
        <button type="submit" class="login-btn">Inloggen</button>
      </form>
    </div>
  </div>

  <div class="app-container app-hidden" id="app">
    
    <main class="viewer-section">
      <header class="app-header">
        <h1>Zoheb's SVG <span class="accent">Validator</span></h1>
        <p class="sub-credit">made by zoheb "examen"</p>
      </header>

             
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-prompt">
              <span>Sleep SVG hier in<mark>klik om te zoeken</mark></span>
        </div>
        <input type="file" id="fileInput" accept=".svg" class="file-input">
        <div id="svgPreview" class="svg-preview"></div>
      </div>

      <section class="tree-container" id="treeContainer">
        <h3>Component Tree</h3>
        <div class="tree-content" id="componentTree">
          <span class="tree-placeholder">Upload een SVG om de componenten boom te bekijken...</span>
        </div>
      </section>
    </main>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Validatie Rapport</h2>
        <div id="statusBadge" class="badge">Wachten op SVG bestand...</div>
      </div>
      <div class="error-list" id="errorList">
      </div>
    </aside>

  </div>

</body>
</html>
